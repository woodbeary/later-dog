name: ${COMPOSE_PROJECT_NAME:-laterdog}
services:
  laterdog:
    init: true
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${LATERDOG_BASE_IMAGE:-ghcr.io/woodbeary/later-dog:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${LATERDOG_LOCAL_IMAGE:-laterdog-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${LATERDOG_BIND_ADDRESS:-127.0.0.1}:${LATERDOG_HTTP_PORT:-8080}:80"
    environment:
      LATERDOG_SERVER_PORT: "8799"
      LATERDOG_WEBHOOK_PORT: "8800"
      LATERDOG_PUBLIC_URL: ${LATERDOG_PUBLIC_URL:-http://localhost:${LATERDOG_HTTP_PORT:-8080}}
      LATERDOG_WEBHOOK_PUBLIC_URL: ${LATERDOG_WEBHOOK_PUBLIC_URL:-${LATERDOG_PUBLIC_URL:-http://localhost:${LATERDOG_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('laterdog')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:laterdog
    environment:
      LATERDOG_HTTPS_HOST: ${LATERDOG_HTTPS_HOST:-}
      LATERDOG_BIND_ADDRESS: ${LATERDOG_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export LATERDOG_UPSTREAM_SCHEME=http
        if [ -n "$$LATERDOG_HTTPS_HOST" ] && [ "$$LATERDOG_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "LATERDOG_HTTPS_HOST requires LATERDOG_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$LATERDOG_HTTPS_HOST" ]; then
          export LATERDOG_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      laterdog:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${LATERDOG_DATA_EXTERNAL:-false}
    name: ${LATERDOG_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-laterdog}_data}
  caddy_data:
  caddy_config:
