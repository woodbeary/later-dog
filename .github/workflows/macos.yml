name: macOS preview build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional new tag to publish as a release (vX.Y.Z matching package.json, or vX.Y.Z-preview.N)
        type: string
        default: ''
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load later.dog's signing identity
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_DEVELOPER_ID_P12" ] && [ -z "$MAC_SIGNING_P12" ]; then echo 'No signing identity configured; this build is signed ad hoc.'; exit 0; fi
          KC="$RUNNER_TEMP/laterdog-signing.keychain-db"
          KPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          if [ -n "$MAC_DEVELOPER_ID_P12" ]; then
            for CA in DeveloperIDCA:7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f DeveloperIDG2CA:f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a; do
              curl -fsSL "https://www.apple.com/certificateauthority/${CA%%:*}.cer" -o "$RUNNER_TEMP/${CA%%:*}.cer"
              echo "${CA#*:}  $RUNNER_TEMP/${CA%%:*}.cer" | shasum -a 256 -c -
              security import "$RUNNER_TEMP/${CA%%:*}.cer" -k "$KC" > /dev/null
            done
            printf '%s' "$MAC_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$MAC_DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
            rm -f "$RUNNER_TEMP/signing.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
            IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"Developer ID Application: \([^"]*\)".*/\1/p' | head -n 1)"
            if [ -z "$IDENTITY" ]; then echo 'MAC_DEVELOPER_ID_P12 holds no valid Developer ID Application identity.'; exit 1; fi
            echo "LATERDOG_MAC_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
              printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
              echo 'LATERDOG_NOTARIZE=1' >> "$GITHUB_ENV"
            fi
          else
            printf '%s' "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$MAC_SIGNING_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
            rm -f "$RUNNER_TEMP/signing.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
            security find-certificate -c 'later.dog Developer' -p "$KC" > "$RUNNER_TEMP/signing.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
            echo 'LATERDOG_MAC_IDENTITY=later.dog Developer' >> "$GITHUB_ENV"
          fi
          security find-identity -v -p codesigning "$KC"
          echo "LATERDOG_UPDATE_FEED=https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/" >> "$GITHUB_ENV"
      - run: pnpm laterdog:package
      - run: pnpm test:packaged-server
      - name: Inspect application identity and bundled supervisor
        run: |
          APP='release/mac-arm64/later.dog.app'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/server/laterdog/main.js"
          test -f "$APP/Contents/Resources/server/laterdog/mcp.js"
          test -f "$APP/Contents/Resources/licenses/later.dog-NOTICE.txt"
          codesign --verify --deep --strict "$APP"
          codesign -dr - "$APP" 2>&1 | grep designated
          if [ "${LATERDOG_MAC_IDENTITY:-}" = 'later.dog Developer' ]; then
            codesign -dr - "$APP" 2>&1 | grep -Eq 'certificate (leaf|root) = H"6ce7d3fb20195fbe66e9bb8dd1d272272977fae2"'
          elif [ -n "${LATERDOG_MAC_IDENTITY:-}" ]; then
            TEAM="$(printf '%s' "$LATERDOG_MAC_IDENTITY" | sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p')"
            codesign -dr - "$APP" 2>&1 | grep -q 'anchor apple generic'
            codesign -dr - "$APP" 2>&1 | grep -Eq "certificate leaf\[subject\.OU\] = \"?$TEAM\"?"
          fi
          FEED="$(ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/later.dog" -p "require(process.argv[1]).laterdogUpdateFeed ?? ''" "$PWD/$APP/Contents/Resources/app.asar/package.json")"
          echo "Update feed: ${FEED:-none}"
          test "$FEED" = "${LATERDOG_UPDATE_FEED:-}"
          grep -Eq '^updaterCacheDirName: [A-Za-z0-9._-]+$' "$APP/Contents/Resources/app-update.yml"
      - name: Notarize and staple
        if: env.LATERDOG_NOTARIZE == '1' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          APP='release/mac-arm64/later.dog.app'
          KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          ID="$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")"
          if [ "$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json")" != 'Accepted' ]; then
            if [ -n "$ID" ]; then xcrun notarytool log "$ID" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"; fi
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP"
          rm -f "$RUNNER_TEMP/notarize.zip" "$KEY"
      - name: Zip the app for download
        run: ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/later.dog.app later.dog-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: later.dog-macOS-arm64
          path: later.dog-macOS-arm64.zip
          retention-days: 14
          if-no-files-found: error
      - name: Publish the requested release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # vX.Y.Z publishes a release; vX.Y.Z-preview.N a prerelease. Anything else is refused.
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its binaries.'
            exit 1
          fi
          APP='release/mac-arm64/later.dog.app'
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          if [[ "$RELEASE_TAG" != "v$VERSION" && "$RELEASE_TAG" != "v$VERSION"-preview.* ]]; then
            echo "The app is $VERSION; a $RELEASE_TAG release would offer it as an update forever. Refusing."
            exit 1
          fi
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/later.dog-macOS-arm64.zip
          node scripts/laterdog-release-files.mjs --tag "$RELEASE_TAG" --zip out/later.dog-macOS-arm64.zip --out out
          assets=(out/later.dog-macOS-arm64.zip out/SHA256SUMS.txt)
          [[ -f out/latest-mac.yml ]] && assets+=(out/latest-mac.yml)
          prerelease=()
          [[ "$RELEASE_TAG" == *-preview.* ]] && prerelease=(--prerelease)
          gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" "${prerelease[@]}" --title "later.dog $RELEASE_TAG" --notes-file out/NOTES.md
