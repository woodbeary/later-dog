name: Cloud home Worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-home-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/laterdog/home
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm exec wrangler types
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - name: Deploy the Worker, leaving every container and its image as they are
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config wrangler.production.json --containers-rollout=none
