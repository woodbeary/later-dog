name: Push hook proof
on:
  pull_request:
    paths:
      - .github/workflows/typecheck-comparison.yml
      - scripts/git-hooks/**
      - .ci-fast-hook-lab/**
permissions:
  contents: read
concurrency:
  group: push-hook-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install frozen project dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the pinned formatter outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/hook-tools"
          printf '{"private":true}\n' > "$RUNNER_TEMP/hook-tools/package.json"
          pnpm --dir "$RUNNER_TEMP/hook-tools" add --save-exact oxfmt@0.80.0
          echo "CI_FAST_OXFMT=$RUNNER_TEMP/hook-tools/node_modules/.bin/oxfmt" >> "$GITHUB_ENV"
      - name: Prove old failures and new failure handling
        env:
          CI_FAST_OUTPUT: ${{ runner.temp }}/push-hook-proof
        run: node .ci-fast-hook-lab/prove.mjs
      - name: Keep raw behavior and formatter results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: push-hook-proof
          path: ${{ runner.temp }}/push-hook-proof
          if-no-files-found: error
          retention-days: 7
