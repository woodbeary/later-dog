name: later.dog Dev build
on:
  push:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: later-dog-dev-build
  cancel-in-progress: false
jobs:
  package:
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 90
    env:
      LATERDOG_VARIANT: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Name this build
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DEV_VERSION="$(node --input-type=module -e "import { devVersion } from './scripts/laterdog-dev-build.mjs'; console.log(devVersion(process.argv[1], process.argv[2]))" "$VERSION" "${{ github.run_number }}")"
          echo "LATERDOG_DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"
          echo "Building later.dog Dev $DEV_VERSION"
      - name: Load the signing identity
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_DEVELOPER_ID_P12" ] && [ -z "$MAC_SIGNING_P12" ]; then echo 'No signing identity configured; this build is signed ad hoc.'; exit 0; fi
          KC="$RUNNER_TEMP/laterdog-signing.keychain-db"
          KPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          if [ -n "$MAC_DEVELOPER_ID_P12" ]; then
            for CA in DeveloperIDCA:7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f DeveloperIDG2CA:f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a; do
              curl -fsSL "https://www.apple.com/certificateauthority/${CA%%:*}.cer" -o "$RUNNER_TEMP/${CA%%:*}.cer"
              echo "${CA#*:}  $RUNNER_TEMP/${CA%%:*}.cer" | shasum -a 256 -c -
              security import "$RUNNER_TEMP/${CA%%:*}.cer" -k "$KC" > /dev/null
            done
            printf '%s' "$MAC_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$MAC_DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
            rm -f "$RUNNER_TEMP/signing.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
            IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"Developer ID Application: \([^"]*\)".*/\1/p' | head -n 1)"
            if [ -z "$IDENTITY" ]; then echo 'MAC_DEVELOPER_ID_P12 holds no valid Developer ID Application identity.'; exit 1; fi
            echo "LATERDOG_MAC_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
              printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
              echo 'LATERDOG_NOTARIZE=1' >> "$GITHUB_ENV"
            fi
          else
            printf '%s' "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$MAC_SIGNING_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
            rm -f "$RUNNER_TEMP/signing.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
            security find-certificate -c 'later.dog Developer' -p "$KC" > "$RUNNER_TEMP/signing.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
            echo 'LATERDOG_MAC_IDENTITY=later.dog Developer' >> "$GITHUB_ENV"
          fi
          security find-identity -v -p codesigning "$KC"
          echo "LATERDOG_UPDATE_FEED=https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-latest/" >> "$GITHUB_ENV"
      - run: pnpm laterdog:package
      - name: Inspect application identity and bundled supervisor
        run: |
          APP='release/mac-arm64/later.dog Dev.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'dog.later.app.dev'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Contents/Info.plist")" = 'later.dog Dev'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Contents/Info.plist")" = 'laterdog-dev'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$LATERDOG_DEV_VERSION"
          test -f "$APP/Contents/Resources/server/laterdog/main.js"
          test -f "$APP/Contents/Resources/server/laterdog/mcp.js"
          test -f "$APP/Contents/Resources/licenses/later.dog-NOTICE.txt"
          codesign --verify --deep --strict "$APP"
          codesign -dr - "$APP" 2>&1 | grep designated
          if [ "${LATERDOG_MAC_IDENTITY:-}" = 'later.dog Developer' ]; then
            codesign -dr - "$APP" 2>&1 | grep -Eq 'certificate (leaf|root) = H"6ce7d3fb20195fbe66e9bb8dd1d272272977fae2"'
          elif [ -n "${LATERDOG_MAC_IDENTITY:-}" ]; then
            TEAM="$(printf '%s' "$LATERDOG_MAC_IDENTITY" | sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p')"
            codesign -dr - "$APP" 2>&1 | grep -q 'anchor apple generic'
            codesign -dr - "$APP" 2>&1 | grep -Eq "certificate leaf\[subject\.OU\] = \"?$TEAM\"?"
          fi
          PACKAGE="$PWD/$APP/Contents/Resources/app.asar/package.json"
          FEED="$(ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/later.dog Dev" -p "require(process.argv[1]).laterdogUpdateFeed ?? ''" "$PACKAGE")"
          VARIANT="$(ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/later.dog Dev" -p "require(process.argv[1]).laterdogVariant ?? ''" "$PACKAGE")"
          echo "Update feed: ${FEED:-none}; variant: ${VARIANT:-none}"
          test "$FEED" = "${LATERDOG_UPDATE_FEED:-}"
          test "$VARIANT" = 'dev'
          grep -Eq '^updaterCacheDirName: laterdog-dev-updater$' "$APP/Contents/Resources/app-update.yml"
      - name: Notarize and staple
        if: env.LATERDOG_NOTARIZE == '1'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          APP='release/mac-arm64/later.dog Dev.app'
          KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          ID="$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")"
          if [ "$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json")" != 'Accepted' ]; then
            if [ -n "$ID" ]; then xcrun notarytool log "$ID" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"; fi
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP"
          rm -f "$RUNNER_TEMP/notarize.zip"
      - name: Build the disk image
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          rm -f release/later.dog-Dev-macOS-arm64.dmg
          pnpm exec electron-builder --mac dmg --arm64 --prepackaged 'release/mac-arm64/later.dog Dev.app' --config electron-builder.dev.yml --publish never -c.dmg.artifactName=later.dog-Dev-macOS-arm64.dmg
          hdiutil verify release/later.dog-Dev-macOS-arm64.dmg
      - name: Sign, notarize and staple the disk image
        if: env.LATERDOG_NOTARIZE == '1'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG='release/later.dog-Dev-macOS-arm64.dmg'
          KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          codesign --force --sign "Developer ID Application: $LATERDOG_MAC_IDENTITY" --timestamp "$DMG"
          codesign --verify --strict "$DMG"
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary-dmg.json" || true
          cat "$RUNNER_TEMP/notary-dmg.json"
          ID="$(jq -r '.id // empty' "$RUNNER_TEMP/notary-dmg.json")"
          if [ "$(jq -r '.status // empty' "$RUNNER_TEMP/notary-dmg.json")" != 'Accepted' ]; then
            if [ -n "$ID" ]; then xcrun notarytool log "$ID" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"; fi
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          rm -f "$KEY"
      - name: Zip the app and write the Dev update feed
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent 'release/mac-arm64/later.dog Dev.app' out/later.dog-Dev-macOS-arm64.zip
          cp release/later.dog-Dev-macOS-arm64.dmg out/later.dog-Dev-macOS-arm64.dmg
          node scripts/laterdog-dev-build.mjs --version "$LATERDOG_DEV_VERSION" --zip out/later.dog-Dev-macOS-arm64.zip --dmg out/later.dog-Dev-macOS-arm64.dmg --out out --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --subject "$(git log -1 --format=%s)"
      - uses: actions/upload-artifact@v4
        with:
          name: later.dog-Dev-macOS-arm64
          path: out/
          retention-days: 14
          if-no-files-found: error
      - name: Publish the rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-latest > /dev/null 2>&1; then
            gh release delete dev-latest --cleanup-tag --yes
          fi
          gh release create dev-latest out/later.dog-Dev-macOS-arm64.dmg out/later.dog-Dev-macOS-arm64.zip out/dev-mac.yml out/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "later.dog Dev (rolling build of dev)" --notes-file out/NOTES.md
