services:
  supervisor:
    build:
      context: ../..
      dockerfile: deploy/laterdog/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9010:9010"
    volumes:
      - laterdog-state:/var/lib/laterdog
      - ./profiles:/home/node/.codex
      - ./github:/home/node/.config/gh
    environment:
      LATERDOG_WORKSPACE_URL: ${LATERDOG_WORKSPACE_URL:-}
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
volumes:
  laterdog-state:
