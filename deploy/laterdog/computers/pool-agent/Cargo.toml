[package]
name = "laterdog-pool-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
