services:
  laterdog:
    build:
      context: ..
      args:
        ENGINES: ${ENGINES:-}
    image: laterdog:local
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "80:80"
      - "443:443"
    environment:
      LATERDOG_SERVER_PORT: "8799"
      LATERDOG_WEBHOOK_PORT: "8800"
      LATERDOG_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      LATERDOG_PUBLIC_URL: https://${DOMAIN}
      LATERDOG_SIGNIN_EMAILS: ${LATERDOG_SIGNIN_EMAILS:-}
      LATERDOG_SIGNIN_MEMBER_EMAILS: ${LATERDOG_SIGNIN_MEMBER_EMAILS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -q laterdog"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: "service:laterdog"
    depends_on:
      laterdog:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
