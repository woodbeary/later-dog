# One later.dog tenant: the harness server plus Caddy for TLS + login.
#
# Caddy runs in the server's network namespace, so it reaches the server on
# 127.0.0.1 — the server never binds a public interface. Ports are therefore
# declared on the `laterdog` service (the namespace owner).
#
#   cp .env.example .env   # set DOMAIN
#   docker compose up -d --build   # builds the image from this checkout
services:
  laterdog:
    build:
      context: ..
      args:
        ENGINES: ${ENGINES:-}
    # the name `docker compose up --build` gives the image it builds from this checkout
    image: laterdog:local
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "80:80"
      - "443:443"
    environment:
      LATERDOG_SERVER_PORT: "8799"
      LATERDOG_WEBHOOK_PORT: "8800"
      # what the app prints as hook URLs — Caddy passes /hooks/* straight through
      LATERDOG_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      # pairing links for remote clients point here (docs/self-hosting.md)
      LATERDOG_PUBLIC_URL: https://${DOMAIN}
      # Who may sign in with an emailed code at /pair (docs/self-hosting.md,
      # "Sign in with your email"). Empty means pairing codes only.
      LATERDOG_SIGNIN_EMAILS: ${LATERDOG_SIGNIN_EMAILS:-}
      LATERDOG_SIGNIN_MEMBER_EMAILS: ${LATERDOG_SIGNIN_MEMBER_EMAILS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -q laterdog"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: "service:laterdog"
    depends_on:
      laterdog:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
